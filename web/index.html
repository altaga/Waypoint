<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waypoint concierge</title>
<meta name="description" content="Waypoint, a travel-readiness concierge on a simulated Alexa+ host (a real MCP client).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <strong>Waypoint</strong> <span class="muted">· simulated Alexa+ host, not affiliated with Amazon</span>
  </div>
  <div class="controls">
    <select id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
    <select id="device" aria-label="Device">
      <option value="show">Echo Show</option>
      <option value="mobile">Mobile</option>
      <option value="voice">Voice only</option>
    </select>
    <label class="toggle"><input type="checkbox" id="voiceOut" checked> <span id="lblVoiceOut">Speak</span></label>
    <button id="demoGroup" type="button">Demo group</button>
    <button id="reset" type="button">New session</button>
  </div>
</header>

<main class="layout">
  <section class="frame" id="frame" data-device="show">
    <div class="screen">
      <div class="topbar">
        <span class="clock" id="clock"></span>
        <span class="brand">Waypoint</span>
        <span class="conn" id="connState">connecting…</span>
      </div>
      <div class="stage" id="stage">
        <div id="hero"></div>
        <div class="reply">
          <h1 class="headline" id="headline" aria-live="polite"></h1>
          <div class="thinking" id="thinking" hidden><span class="dots"><i></i><i></i><i></i></span><span id="thinkingText"></span></div>
          <div class="trace" id="trace"></div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="cards" id="cards"></div>
      </div>
      <div class="apps" id="apps"></div>
      <div class="form" id="form" hidden></div>
      <div class="lightbar" id="lightbar" data-state="idle" aria-hidden="true"></div>
    </div>
    <div class="transcript" id="transcript" aria-live="polite"></div>
    <form class="input" id="inputForm">
      <button type="button" id="mic" aria-label="Speak"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <input id="text" type="text" autocomplete="off" placeholder="Type or speak" />
      <button type="submit" id="send">Send</button>
    </form>
    <p class="hint" id="brainMode"></p>
  </section>

  <aside class="side">
    <details open>
      <summary id="lblProtocol">Protocol log</summary>
      <pre id="log" class="log"></pre>
    </details>
    <details>
      <summary id="lblAbout">About this host</summary>
      <p class="small" id="aboutText"></p>
    </details>
  </aside>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
