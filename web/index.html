<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waypoint · concierge de viajes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050507'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%232997ff' stroke-width='2.2'/%3E%3Cpath d='M16 8l3.6 8L16 24l-3.6-8z' fill='%232997ff'/%3E%3C/svg%3E">
<meta name="theme-color" content="#050507">
<meta name="description" content="Waypoint, a travel-readiness concierge on a simulated Alexa+ host (a real MCP client).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The readiness ring's gradient, shared by every ring on the page. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="wpRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64d2ff"/><stop offset="1" stop-color="#30d158"/></linearGradient></defs></svg>
<header class="top">
  <div class="brand-row">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="wpLogo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fdcff"/><stop offset=".55" stop-color="#2997ff"/><stop offset="1" stop-color="#5e5ce6"/></linearGradient></defs><circle cx="16" cy="16" r="13.5" fill="none" stroke="url(#wpLogo)" stroke-width="2.2"/><path d="M16 6.5l4.4 9.5L16 25.5l-4.4-9.5z" fill="url(#wpLogo)"/><circle cx="16" cy="16" r="1.8" fill="#050507"/></svg>
    <div>
      <strong class="brand">Waypoint</strong>
      <span class="tagline" id="tagline">Travel concierge · simulated Alexa+ host</span>
    </div>
  </div>
  <button type="button" id="menuBtn" class="btn-ghost menu-btn" aria-expanded="false" aria-controls="controlsBox"></button>
  <div class="controls" id="controlsBox">
    <div class="seg" role="group" aria-label="Idioma">
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <select id="device" aria-label="Dispositivo">
      <option value="show">Echo Show</option>
      <option value="mobile">Móvil</option>
      <option value="voice">Solo voz</option>
    </select>
    <label class="toggle logos-toggle" id="logosToggle"><input type="checkbox" id="logos"> <span id="lblLogos">Logos</span></label>
    <button id="demoGroup" class="btn-ghost" type="button">Ejemplo</button>
    <button id="reset" class="btn-ghost" type="button">Nueva sesión</button>
    <button id="wipe" class="btn-ghost" type="button">Borrar mis datos</button>
  </div>
</header>

<div id="announce" class="sr-only" role="status" aria-live="polite"></div>
<div id="announceToast" class="sr-only" role="status" aria-live="polite"></div>
<main class="layout">
  <section class="frame" id="frame" data-device="show">
    <div class="screen">
      <div class="topbar">
        <span class="clock" id="clock"></span>
        <span class="brand-s">Waypoint</span>
        <span class="conn" id="connState" role="status"></span>
      </div>
      <div class="stage" id="stage">
        <div class="home" id="home" aria-hidden="true">
          <div class="home-time" id="homeTime"></div>
          <div class="home-date" id="homeDate"></div>
        </div>
        <div id="hero"></div>
        <div class="reply">
          <h1 class="headline" id="headline" aria-live="polite"></h1>
          <p class="more-cue" id="moreCue" hidden></p>
        </div>
        <div class="cards" id="cards"></div>
        <div class="welcome" id="welcome">
          <p class="welcome-intro" id="welcomeIntro"></p>
          <ul class="welcome-tags" id="welcomeTags"></ul>
        </div>
      </div>
      <div class="apps" id="apps"></div>
      <div class="form" id="form" hidden></div>
      <div class="lightbar" id="lightbar" data-state="idle" aria-hidden="true"></div>
    </div>
  </section>

  <section class="chat-col" aria-labelledby="chatTitle">
    <div class="chat-head">
      <span id="chatTitle"></span>
      <label class="toggle"><input type="checkbox" id="voiceOut" checked> <span id="lblVoiceOut"></span></label>
    </div>
    <div class="transcript" id="transcript" aria-live="polite"></div>
    <div class="thinking" id="thinking" hidden><span class="dots"><i></i><i></i><i></i></span><span id="thinkingText"></span></div>
    <div class="trace" id="trace"></div>
    <div class="chips" id="chips"></div>
    <form class="input" id="inputForm">
      <button type="button" id="mic" aria-label="Hablar"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <input id="text" type="text" autocomplete="off" />
      <button type="submit" id="send"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5.5M5.5 11.5L12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
  </section>
</main>

<footer class="foot">
  <details>
    <summary id="lblProtocol"></summary>
    <p class="small" id="brainMode"></p>
    <p class="small" id="aboutText"></p>
    <pre id="log" class="log"></pre>
  </details>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
